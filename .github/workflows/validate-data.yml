name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate dataset
        run: npm test

      - name: Build distribution bundle
        run: npm run build

      - name: Export CSV and glossary
        run: npm run export

      - name: Run benchmark scorer
        run: npm run evaluate
