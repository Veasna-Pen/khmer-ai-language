name: Validate Khmer AI Language Reference Data

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate dataset schemas and Unicode integrity
      run: npm test

    - name: Build distribution artifacts
      run: npm run build

    - name: Export multi-format releases
      run: npm run export
